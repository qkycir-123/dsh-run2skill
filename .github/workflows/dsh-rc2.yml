name: DSH 0.2.2-rc.1 compatibility

on:
  pull_request:
    paths:
      - .github/workflows/dsh-rc2.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsdown.config.ts
      - probes/**
      - src/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

env:
  DSH_HEAD: 66491b05e3f05ad35bcdd4f6cd7ed26041d9e3db

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: run2skill
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_HEAD }}
          path: deepseek-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable
      - name: Run DSH contract probes
        shell: pwsh
        run: ./run2skill/probes/run-dsh-contract-probes.ps1 -DshSource ./deepseek-harness -ExpectedDshHead $env:DSH_HEAD

  profile-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: run2skill
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_HEAD }}
          path: deepseek-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable
      - name: Install candidate dependencies
        working-directory: run2skill
        run: pnpm install --frozen-lockfile
      - name: Run DSH profile lifecycle probe
        shell: pwsh
        run: ./run2skill/probes/run-dsh-rc2-profile-probe.ps1 -DshSource ./deepseek-harness
